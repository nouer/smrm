  <!-- Text lines -->
  <line x1="206" y1="230" x2="306" y2="230" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <line x1="206" y1="280" x2="306" y2="280" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
